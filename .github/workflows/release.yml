name: Release Plugin

on:
  push:
    tags:
      - '*-v[0-9]*'  # e.g. pokemon-champions-v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract plugin name and version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          # pokemon-champions-v1.0.0 → plugin=pokemon-champions, version=1.0.0
          VERSION="${TAG##*-v}"
          PLUGIN="${TAG%-v${VERSION}}"
          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify plugin directory exists
        run: |
          PLUGIN="${{ steps.meta.outputs.plugin }}"
          if [ ! -d "plugins/${PLUGIN}" ]; then
            echo "Error: plugins/${PLUGIN} not found"
            exit 1
          fi

      - name: Create archives per skill
        run: |
          PLUGIN="${{ steps.meta.outputs.plugin }}"
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          SKILLS_DIR="plugins/${PLUGIN}/skills"
          for SKILL_PATH in "${SKILLS_DIR}"/*/; do
            SKILL=$(basename "${SKILL_PATH}")
            ARCHIVE="dist/${PLUGIN}-${SKILL}-${VERSION}"
            cd "${SKILL_PATH}"
            zip -r "../../../../${ARCHIVE}.zip" .
            cp "../../../../${ARCHIVE}.zip" "../../../../${ARCHIVE}.skill"
            cd - > /dev/null
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.meta.outputs.plugin }} v${{ steps.meta.outputs.version }}"
          files: dist/*
          generate_release_notes: true
